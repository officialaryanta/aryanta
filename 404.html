
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="404 Page Not Found — Aryanta">
  <title>404 — Page Not Found | Aryanta</title>

  <!-- Automatically match the device's light/dark theme -->
  <script>
    (() => {
      const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>

  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fc;
      --surface: rgba(255,255,255,.78);
      --text: #171923;
      --muted: #73798a;
      --line: rgba(30,40,70,.10);
      --accent: #635bff;
      --accent2: #00b9c7;
      --glow: rgba(99,91,255,.17);
      --grid: rgba(90,100,140,.065);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #080a10;
      --surface: rgba(20,23,34,.78);
      --text: #f5f6ff;
      --muted: #9da4b8;
      --line: rgba(255,255,255,.10);
      --accent: #918aff;
      --accent2: #38d9e8;
      --glow: rgba(112,99,255,.20);
      --grid: rgba(190,200,255,.045);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      transition: background .35s ease, color .35s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    .orb {
      position: fixed;
      z-index: -1;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      filter: blur(95px);
      opacity: .55;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .orb.one {
      top: -170px;
      left: -100px;
      background: var(--glow);
    }

    .orb.two {
      right: -100px;
      bottom: -180px;
      background: rgba(0,185,199,.12);
      animation-delay: -5s;
    }

    header {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: fadeDown .8s both;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.8px;
    }

    .brand img {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 13px;
      box-shadow: 0 4px 20px var(--glow);
    }

    .brand span {
      color: var(--accent);
    }

    .error-status {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 50px;
      background: var(--surface);
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      backdrop-filter: blur(15px);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff7777;
      box-shadow: 0 0 12px rgba(255,100,100,.5);
    }

    main {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 50px 22px 70px;
    }

    .error-content {
      width: min(620px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-wrap {
      position: relative;
      width: 112px;
      height: 112px;
      margin-bottom: 32px;
      animation: fadeUp .8s .1s both;
    }

    .logo-wrap::before,
    .logo-wrap::after {
      content: "";
      position: absolute;
      inset: -12px;
      border: 1px solid var(--line);
      border-radius: 32px;
      animation: rotate 18s linear infinite;
    }

    .logo-wrap::after {
      inset: -22px;
      border-style: dashed;
      opacity: .65;
      animation-direction: reverse;
      animation-duration: 28s;
    }

    .logo-wrap img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 26px;
      box-shadow: 0 15px 55px var(--glow);
      animation: float 4s ease-in-out infinite;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 15px;
      border: 1px solid var(--line);
      border-radius: 50px;
      background: var(--surface);
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: fadeUp .8s .2s both;
    }

    .error-number {
      margin: 19px 0 0;
      font-size: clamp(100px, 23vw, 190px);
      line-height: .95;
      font-weight: 900;
      letter-spacing: -9px;
      background: linear-gradient(
        115deg, var(--accent), #9b72ff 48%, var(--accent2)
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: fadeUp .8s .3s both, shine 6s linear infinite;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(25px, 5vw, 37px);
      font-weight: 800;
      letter-spacing: -1.2px;
      animation: fadeUp .8s .4s both;
    }

    .description {
      max-width: 420px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.85;
      animation: fadeUp .8s .5s both;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 29px;
      animation: fadeUp .8s .6s both;
    }

    .button {
      min-height: 47px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 19px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      background: var(--surface);
      font-family: inherit;
      font-size: 12px;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(15px);
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }

    .button:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 9px 28px var(--glow);
    }

    .button.primary {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(110deg, #635bff, #8974ff);
      box-shadow: 0 8px 24px rgba(99,91,255,.2);
    }

    .button svg {
      width: 17px;
      height: 17px;
    }

    .help-text {
      margin-top: 27px;
      color: var(--muted);
      font-size: 11px;
      animation: fadeUp .8s .7s both;
    }

    footer {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 20px 25px 25px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 11px;
    }

    .footer-brand {
      color: var(--text);
      font-weight: 800;
      letter-spacing: .5px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    @keyframes drift {
      to { transform: translate(45px, 35px) scale(1.12); }
    }

    @media (max-width: 480px) {
      header { padding: 19px 17px; }
      .brand { font-size: 19px; }
      .brand img { width: 36px; height: 36px; }
      .error-status { padding: 8px 10px; font-size: 9px; }
      main { padding: 42px 20px 55px; }
      .logo-wrap { width: 95px; height: 95px; margin-bottom: 29px; }
      .error-number { letter-spacing: -5px; }
      h1 { letter-spacing: -.7px; }
      .description { font-size: 14px; }
      footer { padding: 18px 17px; font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="orb one" aria-hidden="true"></div>
  <div class="orb two" aria-hidden="true"></div>

  <header>
    <div class="brand">
      <img src="image_1778688021380.jpg" alt="Aryanta logo">
      ARYANTA<span>.</span>
    </div>

    <div class="error-status">
      <span class="status-dot"></span>
      ERROR 404
    </div>
  </header>

  <main>
    <section class="error-content" aria-labelledby="error-title">
      <div class="logo-wrap">
        <img src="image_1778688021380.jpg" alt="Aryanta">
      </div>

      <div class="eyebrow">
        <span>✦</span> Lost in space?
      </div>

      <div class="error-number" aria-label="404">404</div>

      <h1 id="error-title">Page Not Found</h1>

      <p class="description">
        Oops! The page you're looking for doesn't exist, may have
        been moved, or the link might be incorrect.
        Let's get you back on track.
      </p>

      <div class="actions">
        <a class="button primary" href="/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">
            <path d="m3 10 9-7 9 7"></path>
            <path d="M5 9v12h14V9"></path>
            <path d="M9 21v-7h6v7"></path>
          </svg>
          Back to Home
        </a>

        <button class="button" type="button" onclick="history.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5"></path>
            <path d="m12 19-7-7 7-7"></path>
          </svg>
          Go Back
        </button>
      </div>

      <div class="help-text">
        If you think something is broken, please try again later.
      </div>
    </section>
  </main>

  <footer>
    <span>© <span id="year"></span> <span class="footer-brand">ARYANTA</span></span>
    <span>Made for what's next ✦</span>
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();

    // Keep browser toolbar theme color in sync with the device theme.
    const themeQuery = window.matchMedia("(prefers-color-scheme: dark)");

    function updateThemeColor() {
      document.querySelector('meta[name="theme-color"]').content =
        themeQuery.matches ? "#080a10" : "#f7f8fc";
    }

    updateThemeColor();
    themeQuery.addEventListener?.("change", updateThemeColor);
  </script>
</body>
</html>
