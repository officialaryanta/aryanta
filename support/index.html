            const results = await Promise.allSettled([
                db.collection("refunds").add(refundPayload),
                db.collection("orders").doc(order.id).update({
                    status: "Cancelled",
                    action_reason: window.tempCancelReason,
                    cancel_reason: window.tempCancelReason,
                    cancelledAt: now,
                    action_notes: "Support Bot"
                }),
                createSupportTicket({
                    type: "cancellation",
                    title: `Cancel order #${orderNo}`,
                    description: window.tempCancelReason,
                    order_id: order.id,
                    order_no: orderNo,
                    refundAmount
                })
            ]);

            const failed = results.every(r => r.status === "rejected");
            if (failed) throw new Error("Cancellation failed");
        }

        async function submitCustomInput(action, skip = false) {
            clearInputError();

            const input = document.getElementById("chatInputVal");
            if (!input && !skip) return;

            const inputType = input?.dataset?.inputType || "text";
            let value = "";

            if (inputType === "file") {
                if (!skip && input.files && input.files[0]) {
                    try {
                        value = await compressImageFile(input.files[0]);
                    } catch (error) {
                        showInputError(error.message || "Image upload failed.");
                        return;
                    }
                }
                userSpeak(skip ? "No photo added" : (value ? "Photo added" : "No photo selected"));
            } else {
                value = String(input.value || "").trim();
                if (!value) {
                    showInputError("Please enter the details first.");
                    return;
                }
                userSpeak(value);
            }

            chatActions.innerHTML = "";

            if (action === "submit_mod_address") {
                await botSpeak("Updating your delivery address...", 350);
                try {
                    await db.collection("orders").doc(window.tempTargetOrder.id).update({
                        delivery_address: value,
                        address_updated_at: new Date().toISOString()
                    });
                    await botSpeak(`<strong style="color:var(--success);"><i class="fas fa-check-circle"></i> Address updated.</strong><br>Order #${escapeHtml(orderKey(window.tempTargetOrder))} now has the new delivery address.`);
                } catch (error) {
                    await botSpeak("I could not update the address. Please try again or create a support ticket.");
                }
                return showOptions(MENU_MAIN);
            }

            if (action === "submit_del_instr") {
                await botSpeak("Saving delivery instructions...", 350);
                try {
                    await db.collection("orders").doc(window.tempTargetOrder.id).update({
                        delivery_instructions: value,
                        delivery_instructions_updated_at: new Date().toISOString()
                    });
                    await botSpeak(`<strong style="color:var(--success);"><i class="fas fa-check-circle"></i> Instructions saved.</strong><br>The logistics/support team can now see your note for Order #${escapeHtml(orderKey(window.tempTargetOrder))}.`);
                } catch (error) {
                    await botSpeak("I could not save delivery instructions. Please try again or create a support ticket.");
                }
                return showOptions(MENU_MAIN);
            }

            if (action === "submit_update_phone") {
                await botSpeak("Updating your phone number...", 350);
                try {
                    const users = await db.collection("users").where("email", "==", normalizeEmail(currentUser.email)).get();
                    const batch = db.batch();
                    users.forEach(doc => batch.update(doc.ref, { phone: value, updatedAt: new Date().toISOString() }));
                    await batch.commit();

                    currentUser.phone = value;
                    localStorage.setItem("active_session", JSON.stringify(currentUser));
                    renderProfile();
                    await botSpeak(`<strong style="color:var(--success);"><i class="fas fa-check-circle"></i> Phone updated.</strong><br>Your new phone number is ${escapeHtml(value)}.`);
                } catch (error) {
                    await botSpeak("I could not update your phone number. Please try again.");
                }
                return showOptions(MENU_MAIN);
            }

            if (action === "callback_phone") {
                window.tempCallbackPhone = value;
                await botSpeak("Please describe why you need a call back.");
                return showCustomInput({
                    type: "textarea",
                    placeholder: "Example: Payment failed but money deducted, please call me.",
                    action: "callback_reason",
                    buttonText: "Continue",
                    maxLength: 700
                });
            }

            if (action === "callback_reason") {
                window.tempCallbackReason = value;
                await botSpeak(`
                    Please confirm your callback request:
                    <div class="chat-card">
                        <div class="detail-row"><span>Phone</span><span>${escapeHtml(window.tempCallbackPhone)}</span></div>
                        <div class="detail-row"><span>Reason</span><span>${escapeHtml(window.tempCallbackReason)}</span></div>
                    </div>
                `);
                return showOptions([
                    { text: "Confirm callback", action: "confirm_callback", icon: "fa-check", primary: true },
                    { text: "Edit phone", action: "call_back", icon: "fa-pen" },
                    { text: "Main Menu", action: "show_main", icon: "fa-house" }
                ]);
            }

            if (action === "submit_ticket_question") {
                window.tempTicketQuestion = value;
                await botSpeak("Now describe the issue in detail so support can understand it clearly.");
                return showCustomInput({
                    type: "textarea",
                    placeholder: "Describe the full issue, order number if any, and what help you need.",
                    action: "submit_ticket_description",
                    buttonText: "Create Ticket",
                    maxLength: 1000
                });
            }

            if (action === "submit_ticket_description") {
                await botSpeak("Creating your support ticket...", 350);
                try {
                    const ticketId = await createSupportTicket({
                        type: "question_not_found",
                        title: window.tempTicketQuestion,
                        description: value
                    });
                    await botSpeak(`<strong style="color:var(--success);"><i class="fas fa-check-circle"></i> Ticket created.</strong><br>Ticket ID: <strong>#${escapeHtml(ticketId.slice(-8).toUpperCase())}</strong><br>Support will review your question.`);
                } catch (error) {
                    await botSpeak("I could not create the ticket. Please try again.");
                }
                return showOptions(MENU_MAIN);
            }

            if (action === "submit_cancel_reason") {
                window.tempCancelReason = value;
                const order = window.tempCancelOrder;
                await botSpeak(`
                    Confirm cancellation for Order #${escapeHtml(orderKey(order))}?
                    <div class="notice-card">
                        The cancellation reason will be saved. If payment was already captured, a refund request will be created with pending status.
                    </div>
                `);
                return showOptions([
                    { text: "Yes, Cancel Item", action: "confirm_cancel", icon: "fa-check", danger: true },
                    { text: "No, Go Back", action: "show_main", icon: "fa-arrow-left", primary: true }
                ]);
            }

            if (action === "submit_replace_reason") {
                window.tempReplaceReason = value;
                await botSpeak("You can upload a product photo as proof. It is optional, but it helps the team verify the replacement faster.");
                return showCustomInput({
                    type: "file",
                    accept: "image/*",
                    action: "submit_replace_photo",
                    buttonText: "Submit with photo",
                    allowSkip: true,
                    skipText: "Submit without photo"
                });
            }

            if (action === "submit_replace_photo") {
                await botSpeak("Submitting replacement request...", 350);
                try {
                    await createReplacementRequest(value || "");
                    await botSpeak(`<strong style="color:var(--success);"><i class="fas fa-check-circle"></i> Replacement request created.</strong><br>Order #${escapeHtml(orderKey(window.tempReplaceOrder))} is now pending review.`);
                } catch (error) {
                    console.error(error);
                    await botSpeak("I could not create the replacement request. Please try again or create a support ticket.");
                }
                return showOptions(MENU_MAIN);
            }

            if (action === "delete_reason") {
                window.tempDeleteReason = value;
                await botSpeak(`<strong style="color:var(--danger);">Warning:</strong> Account deletion is permanent. Your user profile, orders, refunds, claims and callback records linked with this email can be deleted from the database.`);
                return showOptions([
                    { text: "Yes, Delete Permanently", action: "confirm_delete_account", icon: "fa-trash", danger: true },
                    { text: "Cancel", action: "show_main", icon: "fa-xmark", primary: true }
                ]);
            }
        }

        async function handleUserChoice(action, text = "") {
            if (!action) return;

            const silentActions = ["show_main", "show_menu_claims", "show_more"];
            if (!silentActions.includes(action) && !action.includes("_page_")) {
                userSpeak(text || action);
            }

            chatActions.innerHTML = "";

            if (action === "sign_in") {
                location.href = "https://aryanta.in/login/";
                return;
            }

            if (action === "go_back") {
                history.length > 1 ? history.back() : location.href = HOME_URL;
                return;
            }

            if (action.startsWith("track_page_")) return showOrderSelection(Number(action.replace("track_page_", "")) || 0, "track");
            if (action.startsWith("cancel_page_")) return showOrderSelection(Number(action.replace("cancel_page_", "")) || 0, "cancel");
            if (action.startsWith("replace_page_")) return showOrderSelection(Number(action.replace("replace_page_", "")) || 0, "replace");
            if (action.startsWith("mod_address_page_")) return showOrderSelection(Number(action.replace("mod_address_page_", "")) || 0, "mod_address");
            if (action.startsWith("del_instr_page_")) return showOrderSelection(Number(action.replace("del_instr_page_", "")) || 0, "del_instr");
            if (action.startsWith("refund_page_")) return showRefundSelection(Number(action.replace("refund_page_", "")) || 0);
            if (action.startsWith("warranty_page_")) return showWarrantyStatus(Number(action.replace("warranty_page_", "")) || 0);

            if (action.startsWith("track_select_")) {
                const order = findOrderByActionKey(action.replace("track_select_", ""));
                if (!order) {
                    await botSpeak("Order details could not be found. Please refresh and try again.");
                    return showOptions(MENU_MAIN);
                }

                await botSpeak(buildTrackingReport(order));

                const opts = [];
                if (isDelivered(order)) {
                    opts.push({ text: "Replace this item", action: `replace_select_${encodeURIComponent(orderKey(order))}`, icon: "fa-right-left", primary: true });
                } else if (isCancellable(order)) {
                    opts.push({ text: "Cancel this item", action: `cancel_select_${encodeURIComponent(orderKey(order))}`, icon: "fa-ban", danger: true });
                }
                opts.push({ text: "Check Warranty", action: "warranty_status", icon: "fa-shield-halved" });
                opts.push({ text: "Main Menu", action: "show_main", icon: "fa-house" });
                return showOptions(opts);
            }

            if (action.startsWith("cancel_select_")) {
                const order = findOrderByActionKey(action.replace("cancel_select_", ""));
                if (!order) {
                    await botSpeak("Order not found.");
                    return showOptions(MENU_MAIN);
                }
                if (isDelivered(order)) {
                    await botSpeak("This item is delivered, so cancellation is hidden. You can request a replacement instead.");
                    return showOptions([
                        { text: "Replace this item", action: `replace_select_${encodeURIComponent(orderKey(order))}`, icon: "fa-right-left", primary: true },
                        { text: "Main Menu", action: "show_main", icon: "fa-house" }
                    ]);
                }
                window.tempCancelOrder = order;
                await botSpeak(`Please enter the reason for cancelling Order #${escapeHtml(orderKey(order))}.`);
                return showCustomInput({
                    type: "textarea",
                    placeholder: "Enter cancellation reason...",
                    action: "submit_cancel_reason",
                    buttonText: "Continue",
                    maxLength: 700
                });
            }

            if (action.startsWith("replace_select_")) {
                const order = findOrderByActionKey(action.replace("replace_select_", ""));
                if (!order) {
                    await botSpeak("Order not found.");
                    return showOptions(MENU_MAIN);
                }
                if (!isDelivered(order)) {
                    await botSpeak("Replacement can be requested after the item is delivered. For active orders, you can cancel or track it.");
                    return showOptions([
                        { text: "Track order", action: "track_order", icon: "fa-location-dot", primary: true },
                        { text: "Cancel order", action: "start_cancel", icon: "fa-ban" },
                        { text: "Main Menu", action: "show_main", icon: "fa-house" }
                    ]);
                }
                window.tempReplaceOrder = order;
                await botSpeak(`Tell us why you want to replace Order #${escapeHtml(orderKey(order))}.`);
                return showCustomInput({
                    type: "textarea",
                    placeholder: "Example: item damaged, wrong product received, not working...",
                    action: "submit_replace_reason",
                    buttonText: "Continue",
                    maxLength: 800
                });
            }

            if (action.startsWith("mod_address_select_")) {
                const order = findOrderByActionKey(action.replace("mod_address_select_", ""));
                if (!order) return showOptions(MENU_MAIN);
                window.tempTargetOrder = order;
                await botSpeak(`Enter the new complete delivery address for Order #${escapeHtml(orderKey(order))}.`);
                return showCustomInput({
                    type: "textarea",
                    placeholder: "Full new address with landmark, city, state and pincode...",
                    action: "submit_mod_address",
                    buttonText: "Update Address",
                    maxLength: 900
                });
            }

            if (action.startsWith("del_instr_select_")) {
                const order = findOrderByActionKey(action.replace("del_instr_select_", ""));
                if (!order) return showOptions(MENU_MAIN);
                window.tempTargetOrder = order;
                await botSpeak(`Enter delivery instructions for Order #${escapeHtml(orderKey(order))}.`);
                return showCustomInput({
                    type: "textarea",
                    placeholder: "Example: Call before delivery, leave with guard, deliver after 5 PM...",
                    action: "submit_del_instr",
                    buttonText: "Save Instructions",
                    maxLength: 600
                });
            }

            if (action.startsWith("refund_select_")) {
                const refund = findRefundById(action.replace("refund_select_", ""));
                if (!refund) {
                    await botSpeak("Refund request not found.");
                    return showOptions(MENU_CLAIMS);
                }

                const ref = firstDefined(refund.order_no, refund.orderNo, refund.claim_id, refund.order_id, refund.id);
                const status = firstDefined(refund.status, "Pending");
                const amount = firstDefined(refund.refundAmount, refund.amount, refund.total, 0);

                await botSpeak(`
                    <strong>Refund Status</strong>
                    <div class="chat-card">
                        <div class="detail-row"><span>Reference</span><span>#${escapeHtml(ref)}</span></div>
                        <div class="detail-row"><span>Amount</span><span>${money(amount)}</span></div>
                        <div class="detail-row"><span>Status</span><span>${statusPill(status)}</span></div>
                        <div class="detail-row"><span>Created</span><span>${escapeHtml(formatDateTime(firstDefined(refund.timestamp, refund.createdAt)))}</span></div>
                    </div>
                    <div class="notice-card">${escapeHtml(refundProgressText(refund))}</div>
                `);
                return showOptions([
                    { text: "Question not found?", action: "not_found_question", icon: "fa-circle-question", warning: true },
                    { text: "← Back", action: "refund_status", icon: "fa-arrow-left" }
                ]);
            }

            if (action.startsWith("warranty_select_")) {
                const claim = findClaimById(action.replace("warranty_select_", ""));
                if (!claim) {
                    await botSpeak("Warranty claim not found.");
                    return showOptions(MENU_CLAIMS);
                }

                const ref = firstDefined(claim.order_no, claim.orderNo, claim.claim_id, claim.id);
                const status = firstDefined(claim.status, "Pending");
                const issue = firstDefined(claim.issue, claim.description, claim.reason, "N/A");

                await botSpeak(`
                    <strong>Warranty Claim Status</strong>
                    <div class="chat-card">
                        <div class="detail-row"><span>Reference</span><span>#${escapeHtml(ref)}</span></div>
                        <div class="detail-row"><span>Status</span><span>${statusPill(status)}</span></div>
                        <div class="detail-row"><span>Issue</span><span>${escapeHtml(issue)}</span></div>
                        <div class="detail-row"><span>Created</span><span>${escapeHtml(formatDateTime(firstDefined(claim.timestamp, claim.createdAt)))}</span></div>
                    </div>
                    <a class="link-card" href="${WARRANTY_URL}" target="_blank" rel="noopener"><i class="fas fa-up-right-from-square"></i> Open Warranty Page</a>
                `);
                return showOptions([
                    { text: "Question not found?", action: "not_found_question", icon: "fa-circle-question", warning: true },
                    { text: "← Back", action: "warranty_status", icon: "fa-arrow-left" }
                ]);
            }

            switch (action) {
                case "show_main":
                    return showOptions(MENU_MAIN);

                case "show_more":
                    return showOptions(MENU_MORE);

                case "show_menu_claims":
                    return showOptions(MENU_CLAIMS);

                case "track_order":
                    await botSpeak("Which order would you like to track?");
                    return showOrderSelection(0, "track");

                case "start_cancel":
                    await botSpeak("Select the active order you want to cancel. Delivered items will show replacement instead of cancellation.");
                    return showOrderSelection(0, "cancel");

                case "start_replace":
                    await botSpeak("Select the delivered item you want to replace.");
                    return showOrderSelection(0, "replace");

                case "mod_address":
                    await botSpeak("Select an order that has not shipped yet.");
                    return showOrderSelection(0, "mod_address");

                case "add_delivery_instr":
                    await botSpeak("Select an active order to add delivery instructions.");
                    return showOrderSelection(0, "del_instr");

                case "refund_status":
                    await botSpeak("Fetching your refund records...");
                    return showRefundSelection(0);

                case "warranty_status":
                    return showWarrantyStatus(0);

                case "claim_warranty":
                    await botSpeak(`You can claim warranty for eligible products from the warranty page.<br><a class="link-card" href="${WARRANTY_URL}" target="_blank" rel="noopener"><i class="fas fa-file-shield"></i> Claim / Check Warranty</a>`);
                    return showOptions(MENU_CLAIMS);

                case "payment_issue":
                    await botSpeak(`If payment failed but money was deducted, it normally reverses through your bank/payment method after verification. If it is linked to an Aryanta order, create a ticket with the payment/order details.`);
                    return showOptions([
                        { text: "Create ticket", action: "not_found_question", icon: "fa-ticket", primary: true },
                        { text: "Check refund", action: "refund_status", icon: "fa-money-bill-transfer" },
                        { text: "← Back", action: "show_menu_claims", icon: "fa-arrow-left" }
                    ]);

                case "exchange_policy":
                    await botSpeak(`Aryanta replacement/exchange depends on product eligibility, delivery status and issue proof. For delivered defective/wrong items, use <strong>Replace delivered item</strong> and add a photo if available.`);
                    return showOptions([
                        { text: "Replace delivered item", action: "start_replace", icon: "fa-right-left", primary: true },
                        { text: "← Back", action: "show_menu_claims", icon: "fa-arrow-left" }
                    ]);

                case "check_wallet":
                    if (!ensureLogin()) return;
                    await botSpeak("Fetching wallet details...");
                    try {
                        const users = await db.collection("users").where("email", "==", normalizeEmail(currentUser.email)).get();
                        let balance = 0;
                        if (!users.empty) {
                            const data = users.docs[0].data();
                            balance = Number(firstDefined(data.walletBalance, data.wallet, data.balance, 0) || 0);
                        }
                        await botSpeak(`Your Aryanta Wallet Balance is <strong style="font-size:20px;color:var(--accent);">${money(balance)}</strong>.`);
                    } catch (error) {
                        await botSpeak("Wallet details could not be fetched right now.");
                    }
                    return showOptions(MENU_MAIN);

                case "call_back":
                    if (!ensureLogin()) return;
                    await botSpeak("Confirm the phone number where Aryanta support should call you.");
                    return showCustomInput({
                        type: "tel",
                        placeholder: "Enter phone number",
                        value: firstDefined(currentUser.phone, currentUser.mobile, ""),
                        action: "callback_phone",
                        buttonText: "Continue",
                        maxLength: 15
                    });

                case "confirm_callback":
                    if (!ensureLogin()) return;
                    await botSpeak("Submitting callback request...", 350);
                    try {
                        await createCallbackRequest();
                        await botSpeak(`<strong style="color:var(--success);"><i class="fas fa-check-circle"></i> Callback request logged.</strong><br>Support will call you at <strong>${escapeHtml(window.tempCallbackPhone)}</strong>.`);
                    } catch (error) {
                        console.error(error);
                        await botSpeak("Callback request could not be created. Please try again.");
                    }
                    return showOptions(MENU_MAIN);

                case "update_phone":
                    if (!ensureLogin()) return;
                    await botSpeak("Enter your new primary phone number.");
                    return showCustomInput({
                        type: "tel",
                        placeholder: "Example: 9876543210",
                        value: firstDefined(currentUser.phone, currentUser.mobile, ""),
                        action: "submit_update_phone",
                        buttonText: "Update Phone",
                        maxLength: 15
                    });

                case "not_found_question":
                    if (!ensureLogin()) return;
                    await botSpeak("Tell me the question that was not found.");
                    return showCustomInput({
                        type: "text",
                        placeholder: "Enter your question...",
                        action: "submit_ticket_question",
                        buttonText: "Continue",
                        maxLength: 180
                    });

                case "delete_account":
                    if (!ensureLogin()) return;
                    await botSpeak("Please enter the reason for deleting your account.");
                    return showCustomInput({
                        type: "textarea",
                        placeholder: "Reason for account deletion...",
                        action: "delete_reason",
                        buttonText: "Continue",
                        maxLength: 700
                    });

                case "confirm_delete_account":
                    if (!ensureLogin()) return;
                    await botSpeak("Deleting account-linked records...", 450);
                    try {
                        const email = normalizeEmail(currentUser.email);
                        const batch = db.batch();

                        const collections = [
                            ["users", "email"],
                            ["orders", "user_email"],
                            ["refunds", "customer_email"],
                            ["warranty_claims", "user_email"],
                            ["callback_requests", "user_email"],
                            ["support_tickets", "user_email"],
                            ["replacement_requests", "user_email"]
                        ];

                        for (const [collectionName, field] of collections) {
                            const docs = await db.collection(collectionName).where(field, "==", email).get();
                            docs.forEach(doc => batch.delete(doc.ref));
                        }

                        await batch.commit();
                        await botSpeak("Your account-linked records were deleted. Logging out now...");
                        localStorage.removeItem("active_session");
                        setTimeout(() => location.href = HOME_URL, 1200);
                    } catch (error) {
                        console.error(error);
                        await botSpeak("Account deletion failed. Please contact support.");
                        showOptions(MENU_MAIN);
                    }
                    return;

                case "confirm_cancel":
                    if (!ensureLogin()) return;
                    await botSpeak("Cancelling the order and creating refund request...", 400);
                    try {
                        await confirmCancelOrder();
                        await botSpeak(`<strong style="color:var(--success);"><i class="fas fa-check-circle"></i> Cancelled.</strong><br>Order #${escapeHtml(orderKey(window.tempCancelOrder))} has been cancelled and refund request is pending.`);
                    } catch (error) {
                        console.error(error);
                        await botSpeak("Cancellation could not be completed. Please try again or create a support ticket.");
                    }
                    return showOptions(MENU_MAIN);

                default:
                    await botSpeak("I could not understand that action. Please choose an option below.");
                    return showOptions(MENU_MAIN);
            }
        }

        async function initChat() {
            syncThemeFromIndexSettings();
            renderProfile();
            fetchUserDataLive();

            if (!currentUser) {
                await botSpeak(`Welcome to Aryanta Support. Please sign in to access personalized order, refund, warranty and callback features.`);
                return showOptions([{ text: "Sign In", action: "sign_in", icon: "fa-right-to-bracket", primary: true }]);
            }

            await botSpeak(`Hello ${escapeHtml(getFirstName())}, I am your Aryanta support assistant. How can I help you today?`);
            showOptions(MENU_MAIN);
        }

        document.getElementById("menuBtn").addEventListener("click", openSidebar);
        document.getElementById("closeSidebarBtn").addEventListener("click", closeSidebar);
        document.getElementById("overlay").addEventListener("click", closeSidebar);
        document.getElementById("sidebarLogoutBtn").addEventListener("click", logOut);
        document.getElementById("pageBackBtn").addEventListener("click", () => {
            if (history.length > 1) history.back();
            else location.href = HOME_URL;
        });

        chatActions.addEventListener("click", event => {
            const submit = event.target.closest("[data-submit-action]");
            if (submit) {
                submitCustomInput(submit.dataset.submitAction, false);
                return;
            }

            const skip = event.target.closest("[data-skip-action]");
            if (skip) {
                submitCustomInput(skip.dataset.skipAction, true);
                return;
            }

            const actionButton = event.target.closest("[data-action]");
            if (actionButton) {
                handleUserChoice(actionButton.dataset.action, actionButton.dataset.text || actionButton.textContent.trim());
            }
        });

        chatActions.addEventListener("keydown", event => {
            if (event.key !== "Enter") return;
            const target = event.target;
            if (!target || target.dataset.inputType === "textarea") {
                if (!event.ctrlKey && !event.metaKey) return;
            }
            event.preventDefault();
            const submit = chatActions.querySelector("[data-submit-action]");
            if (submit) submit.click();
        });

        chatHistory.addEventListener("click", event => {
            const actionEl = event.target.closest("[data-action]");
            if (actionEl) {
                handleUserChoice(actionEl.dataset.action, actionEl.dataset.text || actionEl.textContent.trim());
            }
        });

        window.addEventListener("storage", event => {
            if (event.key === "aryanta_settings") {
                syncThemeFromIndexSettings();
            }
            if (event.key === "active_session") {
                renderProfile();
                fetchUserDataLive();
            }
        });

        if (window.matchMedia) {
            window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
                if (appSettings.theme === "system") applyTheme();
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(initChat, 160);
        });
    </script>
